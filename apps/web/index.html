<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LifeBalance — задачи с гибкими напоминаниями, семейный бюджет, общий календарь и семейные группы"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Тема до первого рендера, чтобы не было вспышки светлой темы
      try {
        var t = JSON.parse(localStorage.getItem('lifebalance:theme') || '{}').state?.theme || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <title>LifeBalance — задачи, бюджет, календарь и семья</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
