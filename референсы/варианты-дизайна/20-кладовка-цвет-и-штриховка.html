<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кладовка · Подзадачи и длительность</title>
  <style>
    @font-face {
      font-family: Nunito;
      src: url("../демо-кладовка/nunito-variable.ttf") format("truetype");
      font-weight: 200 1000;
      font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background, #f4f5f5);
      color: var(--foreground, #151410);
      font: 700 16px/1.35 Nunito, system-ui, sans-serif;
    }
    h1, h2, ul, p { margin: 0; }
    .definitions { position: absolute; }
    .board {
      max-width: 464px;
      margin-inline: auto;
      padding: 20px 12px 24px;
    }
    .preview-hint { margin-bottom: 11px; font-size: 13px; }
    .screen {
      --paper: #fff;
      --ink: #151410;
      --blue: #135780;
      --dark-blue: #064977;
      --sky: #c4e8f8;
      --gray: #807d75;
      --muted: #5e5b55;
      --coral: #ee7380;
      position: relative;
      isolation: isolate;
      padding: 10px clamp(12px, 5.6%, 23px) 30px;
      overflow: hidden;
      border-radius: 32px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 3px 12px #251b1115;
      color-scheme: light;
    }
    .screen > .corners {
      position: absolute;
      z-index: -1;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .header { display: grid; grid-template-columns: 1fr 54% 1fr; align-items: start; }
    .characters {
      display: block;
      width: 100%;
      aspect-ratio: 690 / 302;
      object-fit: contain;
    }
    .glyph {
      width: 1em;
      height: 1em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle;
    }
    .header .glyph { width: 22px; height: 22px; margin: 13px 6px 0; }
    .header .glyph:last-child { justify-self: end; }
    .task-title {
      font-size: clamp(34px, 11vw, 48px);
      font-weight: 1000;
      letter-spacing: -.062em;
      line-height: .89;
      text-align: center;
      filter: url(#ink-edge);
    }
    .swash { display: block; width: 36%; height: 13px; margin: 10px auto 13px; color: var(--coral); }
    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 9px 4px;
      font-size: 26px;
      font-weight: 1000;
      letter-spacing: -.047em;
      line-height: 1;
    }
    .section-title .glyph { color: var(--coral); }
    .tasks { display: grid; gap: 7px; list-style: none; padding: 0; }
    .task, .action {
      --row-fill: var(--paper);
      --row-line: var(--ink);
      position: relative;
      isolation: isolate;
    }
    .task {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) max-content 17px;
      gap: clamp(5px, 2.3%, 9px);
      align-items: center;
      min-height: 58px;
      padding: 8px clamp(9px, 4.3%, 15px);
    }
    .task .glyph { width: 17px; height: 17px; }
    .task .edit { justify-self: end; }
    .name {
      display: block;
      font-size: clamp(16px, 4.7vw, 19px);
      font-weight: 1000;
      line-height: 1.05;
      letter-spacing: -.041em;
    }
    .status { display: block; margin-top: 3px; font-weight: 850; font-size: 12px; line-height: 1.1; }
    .duration {
      position: relative;
      isolation: isolate;
      min-width: 6em;
      padding: calc(.28em + 1px) calc(.46em + 1px);
      color: var(--chip-ink, inherit);
      text-align: center;
      font: 950 12px/1.18 Nunito, system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .duration small { font: inherit; font-size: .85em; font-weight: 850; }
    .row-art {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      filter: drop-shadow(0 2px 2px #251b1115);
    }
    .base { fill: var(--row-fill); }
    .frame { fill: none; stroke: var(--row-line); stroke-width: 1.55; }
    .row-hatch { color: var(--hatch-color); opacity: var(--hatch-opacity); }
    .hover-ink {
      opacity: 0;
      transition: opacity .27s ease;
    }
    .is-previewing .hover-ink { opacity: var(--hover-opacity, 1); }
    [data-hover-preview]:focus-visible { outline: 2px solid var(--dark-blue); outline-offset: 2px; border-radius: 14px; }
    .done, .later { color: var(--muted); --row-line: var(--gray); }
    .done .frame, .later .frame { opacity: .34; }
    .done .name, .later .name { font-weight: 820; }
    .done .duration, .later .duration { font-weight: 850; }
    .done .edit, .later .edit { color: var(--gray); }
    .running {
      --row-fill: var(--blue);
      --row-line: var(--blue);
      --chip-ink: var(--dark-blue);
      --hatch-color: var(--paper);
      --hatch-opacity: .30;
      color: var(--paper);
    }
    .next {
      --row-fill: var(--sky);
      --row-line: var(--sky);
      --chip-ink: var(--dark-blue);
      --hatch-color: var(--dark-blue);
      --hatch-opacity: .18;
      --hover-opacity: .80;
      color: var(--dark-blue);
    }
    .next .state { width: 20px; height: 20px; }
    .duration-art {
      display: block;
      position: absolute;
      z-index: -1;
      inset: 0;
      width: 100%;
      height: 100%;
      fill: var(--paper);
      pointer-events: none;
    }
    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .35em;
      margin-top: 12px;
      min-height: 41px;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--dark-blue);
      --row-line: var(--dark-blue);
      font-family: inherit;
      font-size: 19px;
      font-weight: 1000;
      letter-spacing: -.025em;
      cursor: pointer;
    }
    .add-action {
      --row-fill: transparent;
      width: 100%;
      margin: 5px 0 0;
      min-height: 44px;
    }
    .add-action .row-art { filter: none; }
    .add-task-hatch {
      position: absolute;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .6;
      pointer-events: none;
    }
    .save { width: 100%; color: #fffdf4; --row-fill: var(--blue); --row-line: var(--blue); }
    @media (prefers-reduced-motion: reduce) { .hover-ink { transition: none; } }
    @media (max-width: 359px) {
      .board { padding-inline: 8px; }
      .screen { padding-inline: 11px; }
      .task { grid-template-columns: 18px minmax(0, 1fr) max-content 15px; }
      .task .glyph { width: 15px; height: 15px; }
      .task .state { width: 17px; height: 17px; }
    }
  </style>
</head>
<body>

  <main class="board">
    <p class="preview-hint">Наведите на строку или кнопку. На телефоне можно коснуться.</p>
    <section class="screen" aria-labelledby="title">
      <svg class="corners" viewBox="0 0 580 800" preserveAspectRatio="none" aria-hidden="true"><use href="#corners" filter="url(#brush-edge)"/></svg>
      <header class="header" aria-hidden="true">
        <svg class="glyph"><use href="#back"/></svg>

      </header>

  <script>
    const svgNamespace = 'http://www.w3.org/2000/svg';
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const targets = [...document.querySelectorAll('[data-hover-preview]')];
    let touchedTarget;

    for (const [index, target] of targets.entries()) {
      const art = target.querySelector('.row-art');
      const box = art.viewBox.baseVal;
      const mask = document.createElementNS(svgNamespace, 'mask');
      const pattern = document.createElementNS(svgNamespace, 'pattern');
      const front = document.createElementNS(svgNamespace, 'ellipse');
      const ink = art.querySelector('.base').cloneNode();
      pattern.id = 'hover-pattern-' + index;
      pattern.setAttribute('href', '#' + target.dataset.hoverPreview);
      mask.id = 'hover-mask-' + index;
      mask.setAttribute('maskUnits', 'userSpaceOnUse');
      mask.setAttribute('x', box.x);
      mask.setAttribute('y', box.y);
      mask.setAttribute('width', box.width);
      mask.setAttribute('height', box.height);
      front.setAttribute('fill', 'url(#hover-hatch-front)');
      mask.append(front);
      ink.setAttribute('class', 'hover-ink');
      ink.setAttribute('fill', 'url(#' + pattern.id + ')');
      ink.setAttribute('mask', 'url(#' + mask.id + ')');
      art.append(mask, pattern);
      art.insertBefore(ink, art.querySelector('.frame'));

      let wave;
      function reveal(event) {
        const bounds = art.getBoundingClientRect();
        const x = event ? event.clientX - bounds.left : bounds.width / 2;
        const y = event ? event.clientY - bounds.top : bounds.height / 2;
        const sx = box.width / bounds.width;
        const sy = box.height / bounds.height;
        const reach = Math.hypot(Math.max(x, bounds.width - x), Math.max(y, bounds.height - y)) / .86;
        pattern.setAttribute('patternTransform', 'scale(' + sx + ' ' + sy + ') rotate(28)');
        front.setAttribute('cx', x * sx);
        front.setAttribute('cy', y * sy);
        front.setAttribute('rx', reach * sx);
        front.setAttribute('ry', reach * sy);
        wave?.cancel();
        if (!reduceMotion.matches) {
          wave = front.animate(
            [{ rx: '0px', ry: '0px' }, { rx: reach * sx + 'px', ry: reach * sy + 'px' }],
            { duration: 560, easing: 'cubic-bezier(.23,.61,.35,1)' },
          );
        }
        target.classList.add('is-previewing');
      }

      function hide() {
        target.classList.remove('is-previewing');
      }

      target.addEventListener('pointerenter', event => {
        if (event.pointerType !== 'touch') reveal(event);
      });
      target.addEventListener('pointerleave', event => {
        if (event.pointerType !== 'touch' && !target.matches(':focus-visible')) hide();
      });
      target.addEventListener('focus', () => {
        if (target.matches(':focus-visible')) reveal();
      });
      target.addEventListener('blur', () => {
        if (!target.matches(':hover') && touchedTarget !== target) hide();
      });
      target.addEventListener('pointerdown', event => {
        if (event.pointerType !== 'touch') return;
        touchedTarget?.classList.remove('is-previewing');
        if (touchedTarget === target) {
          touchedTarget = null;
        } else {
          touchedTarget = target;
          reveal(event);
        }
      });
    }
  </script>
</body>
</html>
