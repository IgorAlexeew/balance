name: Deploy

# Деплой на VPS после зелёного CI (или вручную из Actions): develop → стенд dev, master → prod.
# Сервер готовится один раз скриптом deploy/setup.sh, подробности — в deploy/README.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, master]
  workflow_dispatch:

env:
  BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      contains(fromJSON('["develop","master"]'), github.event.workflow_run.head_branch || github.ref_name)
    runs-on: ubuntu-24.04
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'master' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Самодостаточный бандл: API с prod-зависимостями (Prisma Client сгенерирован) + сборка фронтенда
      - name: Bundle
        run: |
          pnpm --filter @balance/api deploy --prod release
          rm -rf release/src release/test
          cp -r apps/web/dist release/web
          tar -czf release.tgz -C release .

      - name: Upload and release
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ vars.DEPLOY_USER || 'balance' }}@${{ vars.DEPLOY_HOST }}
          APP: balance-${{ env.BRANCH == 'master' && 'prod' || 'dev' }}
          RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
          PORT: ${{ env.BRANCH == 'master' && '3001' || '3002' }}
          VARS: ${{ toJSON(vars) }}
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # .env приложения: переменные и секреты окружения GitHub (кроме DEPLOY_*), см. apps/api/.env.example
          (
            umask 077
            echo "APP_URL=https://${TARGET#*@}"
            jq -rs 'add | to_entries[] | select(.key | test("^(DEPLOY_|github_token$)") | not) | "\(.key)=\(.value)"' \
              <<< "$VARS $SECRETS"
            echo "NODE_ENV=production"
            echo "PORT=$PORT"
            echo "DATABASE_URL=file:/opt/$APP/shared/data/balance.db"
            echo "WEB_DIST_DIR=web"
          ) > app.env
          scp -p app.env "$TARGET:/opt/$APP/shared/.env"
          scp release.tgz "$TARGET:/tmp/$APP-$RELEASE.tgz"
          ssh "$TARGET" bash -s -- "$APP" "$RELEASE" < deploy/release.sh
