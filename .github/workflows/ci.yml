name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Деплой нельзя прерывать посередине (миграции), поэтому push-прогоны не отменяем
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test
        run: pnpm format:check && pnpm check
      - name: Build
        run: pnpm build

  # Деплой после зелёных проверок: develop → стенд dev, master → prod.
  # Сборка идёт здесь, на сервер уходит готовый бандл. Сервер готовится скриптом deploy/setup.sh, см. deploy/README.md.
  deploy:
    needs: check
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'master')
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'master' && 'production' || 'develop' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Самодостаточный бандл: API с prod-зависимостями (Prisma Client сгенерирован) + сборка фронтенда
      - name: Bundle
        run: |
          pnpm --filter @balance/api deploy --prod release
          rm -rf release/src release/test
          cp -r apps/web/dist release/web
          tar -czf release.tgz -C release .

      - name: Upload and release
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ vars.DEPLOY_USER || 'balance' }}@${{ vars.DEPLOY_HOST }}
          ENV_NAME: ${{ github.ref_name == 'master' && 'production' || 'develop' }}
          APP: balance-${{ github.ref_name == 'master' && 'prod' || 'dev' }}
          RELEASE: ${{ github.sha }}
          PORT: ${{ github.ref_name == 'master' && '3001' || '3002' }}
          VARS: ${{ toJSON(vars) }}
          # Секретные ключи интеграций — поимённо; остальные настройки — переменные окружения
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          if [ -z "${TARGET#*@}" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::Нет DEPLOY_HOST/DEPLOY_SSH_KEY в окружении GitHub «$ENV_NAME» (Settings → Environments)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # .env приложения: переменные окружения GitHub (кроме DEPLOY_*) + секреты, см. apps/api/.env.example
          (
            umask 077
            echo "APP_URL=https://${TARGET#*@}"
            jq -r 'to_entries[] | select(.key | startswith("DEPLOY_") | not) | "\(.key)=\(.value)"' <<< "$VARS"
            echo "YANDEX_CLIENT_SECRET=$YANDEX_CLIENT_SECRET"
            echo "AI_API_KEY=$AI_API_KEY"
            echo "NODE_ENV=production"
            echo "PORT=$PORT"
            echo "DATABASE_URL=file:/opt/$APP/shared/data/balance.db"
            echo "WEB_DIST_DIR=web"
          ) > app.env
          scp -p app.env "$TARGET:/opt/$APP/shared/.env"
          scp release.tgz "$TARGET:/tmp/$APP-$RELEASE.tgz"
          ssh "$TARGET" bash -s -- "$APP" "$RELEASE" < deploy/release.sh
